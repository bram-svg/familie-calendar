name: Publish ICS to gh-pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish generated ICS to gh-pages
    runs-on: ubuntu-latest
    env:
      ICS_PUBLIC_TOKEN: ${{ secrets.ICS_PUBLIC_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure ICS secret is set
        run: |
          if [ -z "$ICS_PUBLIC_TOKEN" ]; then
            echo "ERROR: ICS_PUBLIC_TOKEN secret not set"
            exit 1
          fi

      - name: Verify ICS file exists in workspace
        run: |
          OUTPUT_FILE="familie-agenda.ics"
          if [ ! -f "$OUTPUT_FILE" ]; then
            echo "ERROR: $OUTPUT_FILE not found"
            ls -la
            exit 1
          fi

      - name: Temporarily move ICS out of repo workspace
        run: |
          set -e
          TMPDIR=$(mktemp -d)
          echo "TMPDIR=$TMPDIR" >> $GITHUB_ENV
          mv "familie-agenda.ics" "$TMPDIR/"

      - name: Prepare gh-pages branch
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages:gh-pages
            git switch gh-pages
            git rm -rf . || true
          else
            git switch --orphan gh-pages
            git rm -rf . || true
          fi

      - name: Copy ICS back and create index
        run: |
          set -e
          FNAME="familie-agenda-${ICS_PUBLIC_TOKEN}.ics"
          cp "$TMPDIR/familie-agenda.ics" "$FNAME"
          cat > index.html <<EOF
          <!doctype html>
          <meta charset="utf-8">
          <title>Familie agenda</title>
          <p>Publieke kalender (onveilige, token-based toegang). Gebruik de link hieronder in je kalenderclient:</p>
          <p><a href="/${FNAME}">Download ICS (token URL)</a></p>
          EOF
          git add "$FNAME" index.html
          git commit -m "Publish ICS $FNAME [ci skip]" || true

      - name: Push gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin gh-pages --force

      - name: Cleanup temp dir
        run: |
          rm -rf "$TMPDIR"
